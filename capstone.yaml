# capstone.yaml
name: Embeddable Widget & Lead-Capture Platform
run: "docker compose up -d && sleep 3 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
seed: "python seed.py"
test: "pytest -v"
base_url: "http://localhost:8000"
endpoints:
  - POST /api/auth/register
  - POST /api/auth/login
  - GET /api/widgets
  - POST /api/widgets
  - GET /api/widgets/{id}
  - PUT /api/widgets/{id}
  - DELETE /api/widgets/{id}
  - GET /api/widgets/{id}/snippet
  - GET /api/widgets/{id}/config
  - POST /api/submissions
  - GET /api/dashboard/submissions
  - GET /api/dashboard/stats
  - GET /widget.js